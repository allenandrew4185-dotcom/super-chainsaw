version: '3.8'

services:
  # PostgreSQL Database
  postgres:
    image: postgres:15-alpine
    container_name: arbitrage_postgres
    environment:
      POSTGRES_USER: arbitrage_user
      POSTGRES_PASSWORD: arbitrage_password
      POSTGRES_DB: arbitrage_db
    volumes:
      - postgres_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U arbitrage_user"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arbitrage_network

  # Redis Cache
  redis:
    image: redis:7-alpine
    container_name: arbitrage_redis
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - arbitrage_network

  # Backend API
  backend:
    build:
      context: .
      dockerfile: docker/backend.Dockerfile
    container_name: arbitrage_backend
    environment:
      DATABASE_URL: postgresql+asyncpg://arbitrage_user:arbitrage_password@postgres:5432/arbitrage_db
      REDIS_URL: redis://redis:6379/0
      PORT: 8000
      STRIPE_SECRET_KEY: ${STRIPE_SECRET_KEY:-sk_test_your_key}
      PAYPAL_CLIENT_ID: ${PAYPAL_CLIENT_ID:-your_client_id}
      PAYPAL_CLIENT_SECRET: ${PAYPAL_CLIENT_SECRET:-your_secret}
      SQUARE_ACCESS_TOKEN: ${SQUARE_ACCESS_TOKEN:-your_token}
    ports:
      - "8000:8000"
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    volumes:
      - ./backend:/app
    networks:
      - arbitrage_network

  # Frontend
  frontend:
    build:
      context: .
      dockerfile: docker/frontend.Dockerfile
    container_name: arbitrage_frontend
    environment:
      NEXT_PUBLIC_API_URL: http://localhost:8000
    ports:
      - "3000:3000"
    depends_on:
      - backend
    networks:
      - arbitrage_network

volumes:
  postgres_data:

networks:
  arbitrage_network:
    driver: bridge
